name: Bug
description: Reportar un defecto reproducible
title: "[BUG] "
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: ¿Qué está ocurriendo?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente / versión
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: No incluir contraseñas, tokens ni datos sensibles.
